<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login · CRM</title>
<link rel="stylesheet" href="/analytics/styles/login.css">
</head>
<body>
<div class="card">
  <h1>Acesso ao CRM</h1>
  <form id="loginForm">
    <label for="user">Usuário</label>
    <input id="user" type="text" autocomplete="username" required>
    <label for="pass">Senha</label>
    <div class="password">
      <input id="pass" type="password" autocomplete="current-password" required>
      <button type="button" class="eye" id="toggleEye" aria-label="Mostrar senha">&#128065;</button>
    </div>
    <button type="submit" id="submitBtn">Entrar</button>
  </form>
  <div id="erro">Senha incorreta. Tenta de novo.</div>
</div>
<script src="/analytics/scripts/toggle-eye.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async function(e){
  e.preventDefault();
  var btn = document.getElementById('submitBtn');
  var erro = document.getElementById('erro');
  erro.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Entrando...';
  try {
    var res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        user: document.getElementById('user').value,
        password: document.getElementById('pass').value
      })
    });
    var data = await res.json();
    if (res.ok && data.ok) {
      window.location.href = '/crm/painel';
    } else {
      erro.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Entrar';
    }
  } catch (err) {
    erro.textContent = 'Erro de conexão. Tenta de novo.';
    erro.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Entrar';
  }
});
</script>
</body>
</html>
