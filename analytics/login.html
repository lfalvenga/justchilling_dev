<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login · CRM</title>
<link rel="stylesheet" href="/analytics/styles/login.css">
</head>
<body>
<div class="card">
  <h1>Acesso ao CRM</h1>
  <form id="loginForm">
    <label for="user">Usuário</label>
    <input id="user" type="text" autocomplete="username" required>
    <label for="pass">Senha</label>
    <div class="password">
      <input id="pass" type="password" autocomplete="current-password" required>
      <button type="button" class="eye" id="toggleEye" aria-label="Mostrar senha"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.8 21.8 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.8 21.8 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg></button>
    </div>
    <button type="submit" id="submitBtn">Entrar</button>
  </form>
  <div id="erro">Senha incorreta. Tenta de novo.</div>
</div>
<script src="/analytics/scripts/toggle-eye.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async function(e){
  e.preventDefault();
  var btn = document.getElementById('submitBtn');
  var erro = document.getElementById('erro');
  erro.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Entrando...';
  try {
    var res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        user: document.getElementById('user').value,
        password: document.getElementById('pass').value
      })
    });
    var data = await res.json();
    if (res.ok && data.ok) {
      window.location.href = '/crm/painel';
    } else {
      erro.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Entrar';
    }
  } catch (err) {
    erro.textContent = 'Erro de conexão. Tenta de novo.';
    erro.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Entrar';
  }
});
</script>
</body>
</html>
